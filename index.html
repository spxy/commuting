<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Commute Time</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width; initial-scale=1.0">
    <style>
      body {
        background: #fec;
        color: #431;
        font-family: georgia, serif;
        font-size: large;
        line-height: 1.5;
        margin: 0 auto;
        max-width: 40em;
        padding: 2em;
        text-align: center;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.5em;
      }
      input, button {
        background: #edb;
        border-color: #654;
        color: #431;
        display: block;
        font-size: 1em;
        margin: 0 auto 1.5em auto;
        min-width: 5em;
        padding: 0.5em;
      }
      input {
        border: thin solid;
      }
      button:active {
        background: #dca;
      }
      .result {
        border: thick double #987;
        margin-top: 3em;
        padding: 1em;
      }
      .label, .value {
        font-weight: bold;
      }
      .label {
        margin-top: 1em;
        margin-bottom: 0.25em;
      }
      .label:first-child {
        margin: 0;
      }
      .value {
        color: #c00;
      }
    </style>
    <script>
      'use strict'

      let commuteTimeElement
      let daysPerWeekElement
      let workingHoursElement
      let totalTimeElement
      let workDaysElement

      function calc () {
        const commuteTime = parseInt(commuteTimeElement.value)
        const daysPerWeek = parseInt(daysPerWeekElement.value)
        const workingHours = parseInt(workingHoursElement.value)

        const totalHours = commuteTime * daysPerWeek * 52 / 60
        const totalDays = Math.round(totalHours / 24)
        const workDays = Math.round(totalHours / workingHours)
        const workMonths = workDays / 30

        const totalHoursRounded = Math.round(totalHours)
        const totalHoursLabel = totalHoursRounded === 1 ? 'hour' : 'hours'
        const totalDaysLabel = totalDays === 1 ? 'day' : 'days'
        const workDaysLabel = workDays === 1 ? 'day' : 'days'

        totalTimeElement.innerHTML = (
          '&approx; ' + totalHoursRounded + ' ' + totalHoursLabel +
          ' (' + totalDays + ' ' + totalDaysLabel + ')'
        )
        workDaysElement.innerHTML = (
          '&approx; ' + Math.round(workDays) + ' ' + workDaysLabel +
            ' (' + workMonths.toFixed(1) + ' months) of work'
        )
      }

      function init () {
        commuteTimeElement = document.getElementById('commuteTime')
        daysPerWeekElement = document.getElementById('daysPerWeek')
        workingHoursElement = document.getElementById('workingHours')
        totalTimeElement = document.getElementById('totalTime')
        workDaysElement = document.getElementById('workDays')

        calc()
        commuteTimeElement.addEventListener('change', calc)
        daysPerWeekElement.addEventListener('change', calc)
        workingHoursElement.addEventListener('change', calc)
      }

      window.addEventListener('load', init)
    </script>
  </head>
  <body>
    <form>
      <label for="commuteTime">How many minutes does your total daily commute take both ways?</label>
      <input type="number" id="commuteTime" min="0" max="1440" value="60" required>

      <label for="daysPerWeek">How many days a week do you commute to the office?</label>
      <input type="number" id="daysPerWeek" min="0" max="7" value="3" required>

      <label for="workingHours">How many hours do you work in a day on an average?</label>
      <input type="number" id="workingHours" min="0" max="24" value="8" required>
    </form>
    <div class="result">
      <div class="label">Total time spent commuting in a year:</div>
      <div class="value" id="totalTime"></div>
      <div class="label">Amount of work you could do in that time:</div>
      <div class="value" id="workDays"></div>
    </div>
    </div>
  </body>
</html>
